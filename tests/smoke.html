          if (controller === 'town_overviews' && action === 'store_iron_in_all_towns') {

          if (action === 'start_all_celebrations') {

    <script src="../EgelTools.user.js?v=1.2.27"></script>
    <script>
      const getNotificationMessages = () => {
        const button = document.getElementById('egeltools-notifications-button');
        const wasOpen = button.getAttribute('aria-expanded') === 'true';
        if (!wasOpen) button.click();
        const messages = [...document.querySelectorAll('.egeltools-notification')].map(row => ({
          type: row.classList.contains('egeltools-notification--error') ? 'error' : 'success',
          message: row.querySelector('p')?.textContent || '',
        }));
        if (!wasOpen) button.click();
        return messages;
      };
      window.addEventListener('load', async () => {
        const waitFor = async (condition, timeout = 2000) => {
          const started = Date.now();
          while (!condition() && Date.now() - started < timeout) {
            await new Promise((resolve) => setTimeout(resolve, 20));
          }
          return condition();
        };
        console.assert(
          await waitFor(() => document.querySelectorAll('.egeltools-trade-capacity-marker').length === 1),
          'The floating trade activity list should receive one warehouse-capacity line',
        );
        const swordRecruitmentTotal = document.querySelector(
          '#unit_order #sword .egeltools-recruitment-total',
        );
        console.assert(
          await waitFor(() => swordRecruitmentTotal?.textContent === '63')
            && swordRecruitmentTotal.dataset.present === '40'
            && swordRecruitmentTotal.dataset.outside === '8'
            && swordRecruitmentTotal.dataset.queued === '15'
            && swordRecruitmentTotal.classList.contains('unit_order_total')
            && document.querySelector('#unit_order #units')
              .classList.contains('egeltools-recruitment-totals-active')
            && getComputedStyle(document.querySelector('#unit_order #units')).marginTop === '26px'
            && getComputedStyle(swordRecruitmentTotal).width === '57px'
            && getComputedStyle(swordRecruitmentTotal).backgroundColor === 'rgb(255, 240, 189)'
            && !document.querySelector('#unit_order #archer .egeltools-recruitment-total'),
          'Barracks should reserve space for a native-style total above buildable units',
        );
        document.querySelector('#unit_order #units').innerHTML = `
          <button class="dio_reload docks" type="button">Refresh</button>
          <div id="bireme" class="unit_tab">
            <div class="unit unit_order_unit_image unit_icon50x50 bireme">
              <span class="unit_order_total">5</span>
            </div>
          </div>
          <div id="attack_ship" class="unit_tab" style="display:none">
            <div data-unit_id="attack_ship"></div>
          </div>`;
        // Wait past EgelTools' five-second maintenance fallback as well as the
        // mutation observer to prove neither path refreshes an open window.
        await new Promise((resolve) => setTimeout(resolve, 5200));
        console.assert(
          !document.querySelector('#unit_order #bireme .egeltools-recruitment-total'),
          'Docks should not refresh the combined totals automatically',
        );
        document.querySelector('#unit_order .dio_reload').click();
        document.querySelector('#unit_order #units').append(document.createTextNode(''));
        console.assert(
          await waitFor(() => (
            document.querySelector('#unit_order #bireme .egeltools-recruitment-total')?.textContent
              === '11'
          ))
            && !document.querySelector('#unit_order #attack_ship .egeltools-recruitment-total'),
          'The Docks refresh button should refresh the combined total and omit hidden unit types',
        );
        const tradeCapacityMarker = document.querySelector(
          '#toolbar_activity_trades_list .egeltools-trade-capacity-marker',
        );
        console.assert(
          tradeCapacityMarker?.dataset.id === '550924'
            && tradeCapacityMarker.dataset.egeltoolsFullResources === 'stone'
            && tradeCapacityMarker.dataset.egeltoolsMarkerPosition === 'after'
            && tradeCapacityMarker.title.includes('stone reaches 18,000 / 18,000')
            && !document.querySelector('[data-id="550921"].egeltools-trade-capacity-marker'),
          'The red line should follow the dominant incoming resource and ignore actual returning merchants',

          'Muted and below-threshold attackers should not start the alarm',
        );
        console.assert(
          window.__fetchRequests.some((url) => url.endsWith('/data/players.txt')),
          'Missing attack-model points should be resolved from the official world dataset',
        );

        window.__attacks = {};
        await new Promise((resolve) => setTimeout(resolve, 1100));
        mutedPlayers.value = 'Space User';
        mutedPlayers.dispatchEvent(new Event('input', { bubbles: true }));
        console.assert(
          localStorage.getItem('egeltools_attack_alarm_muted_players') === 'Space User',
          'A typed mute should persist immediately without waiting for the field to lose focus',
        );
        window.__attacks.spaceUser = makeAttack('spaceUser', null, undefined, 50000, 501);
        await new Promise((resolve) => setTimeout(resolve, 1100));
        console.assert(
          !document.getElementById('egeltools-attack-alarm-stop'),
          'A spaced username resolved from the origin town should stay muted',
        );
        console.assert(
          window.__fetchRequests.some((url) => url.endsWith('/data/towns.txt')),
          'An attack without a player ID should resolve its town owner from the world dataset',
        );

        window.__attacks = {};
        await new Promise((resolve) => setTimeout(resolve, 1100));
        window.__attacks.strong = makeAttack('strong', 203, 'StrongGuy', 10000);
        console.assert(
          await waitFor(() => document.getElementById('egeltools-attack-alarm-stop')),
          'An attacker at the points threshold should start the alarm',
        );
        console.assert(
          window.__audioInstances.some((audio) => (
            audio.src === 'https://cdn.grcrt.net/ui/s/alarm.mp3' && !audio.paused
          )),
          'An incoming attack should use GRCRT\'s default alarm sound',
        );
        document.getElementById('egeltools-attack-alarm-stop').click();
        mutedPlayers.value = 'MutedGuy, StrongGuy';
        mutedPlayers.dispatchEvent(new Event('input', { bubbles: true }));
        await new Promise((resolve) => setTimeout(resolve, 1100));
        console.assert(
          !document.getElementById('egeltools-attack-alarm-stop'),
          'Changing ignore rules should not retrigger an alarm for an existing attack',
        );
        window.__attacks = {};
        await new Promise((resolve) => setTimeout(resolve, 1100));

        delayEnabled.checked = true;
        delayEnabled.dispatchEvent(new Event('change', { bubbles: true }));
        delayStart.value = '00:00';
        delayStart.dispatchEvent(new Event('change', { bubbles: true }));
        delayEnd.value = '00:00';
        delayEnd.dispatchEvent(new Event('change', { bubbles: true }));
        window.__attacks.cancelled = makeAttack('cancelled', 204, 'CancelledGuy', 50000);
        console.assert(
          await waitFor(() => attackStatus.textContent.includes('Waiting 20 seconds')),
          'An attack in the configured hours should enter the 20-second grace period',
        );
        delete window.__attacks.cancelled;
        await new Promise((resolve) => setTimeout(resolve, 250));
        console.assert(
          !document.getElementById('egeltools-attack-alarm-stop'),
          'An attack cancelled during the grace period should stay silent',
        );

        window.__attacks.delayed = makeAttack('delayed', 205, 'DelayedGuy', 50000);
        console.assert(
          await waitFor(() => document.getElementById('egeltools-attack-alarm-stop')),
          'An attack that survives the grace period should start the alarm',
        );
        document.getElementById('egeltools-attack-alarm-stop').click();
        window.__attacks = {};

        delayEnabled.checked = false;
        delayEnabled.dispatchEvent(new Event('change', { bubbles: true }));
        minimumPoints.value = '0';
        minimumPoints.dispatchEvent(new Event('change', { bubbles: true }));
        mutedPlayers.value = '';
        mutedPlayers.dispatchEvent(new Event('input', { bubbles: true }));
        window.__attacks = undefined;
        const legacyAttackIndicator = document.createElement('div');
        legacyAttackIndicator.className = 'activity attack_indicator active';
        legacyAttackIndicator.innerHTML = '<span class="count js-caption">1</span>';
        document.body.append(legacyAttackIndicator);
        console.assert(
          await waitFor(() => document.getElementById('egeltools-attack-alarm-stop')),
          'The toolbar attack count should remain a safe fallback when detailed models are unavailable',
        );
        document.getElementById('egeltools-attack-alarm-stop').click();
        legacyAttackIndicator.remove();
        window.__attacks = {};

        const floatingButton = document.getElementById('egeltools-celebration-finder-button');
        const hostileStyle = document.createElement('style');
        hostileStyle.textContent = `
          #egeltools-celebration-finder-button {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
          }
          #egeltools-town-distance-sorter-button {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
          }
          #egeltools-resource-checker-button {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
          }
          .gp_town_link {
            display: block !important;
            width: 100% !important;
            text-align: center !important;
          }
          button.egeltools-celebration__badge {
            display: block !important;
            width: 100% !important;
            float: left !important;
            clear: both !important;
          }
        `;
        document.head.append(hostileStyle);

        console.assert(floatingButton, 'The celebrations button should mount in the quick-tools dock');
        console.assert(getComputedStyle(floatingButton).display !== 'none', 'Grepolis CSS should not hide the docked celebrations button');
        console.assert(getComputedStyle(floatingButton).visibility === 'visible', 'The docked celebrations button should remain visible');
        console.assert(
          getComputedStyle(distanceButton).display !== 'none'
            && getComputedStyle(distanceButton).visibility === 'visible',
          'Grepolis CSS should not hide the town-distance button',
        );
        console.assert(
          getComputedStyle(resourceButton).display !== 'none'
            && getComputedStyle(resourceButton).visibility === 'visible',
          'Grepolis CSS should not hide the resource-checker button',
        );
        console.assert(floatingButton.textContent === 'Show CFs', 'The docked celebrations button should start closed');
        floatingButton.click();
        distanceButton.click();
        const celebrationPanel = document.getElementById('egeltools-celebration-finder');
        console.assert(
          !celebrationPanel.hidden && !distancePanel.hidden,
          'The celebration finder and town-distance sorter should stay open together',
        );
        distancePanel.querySelector('#egeltools-town-distance-sorter-close').click();
        console.assert(
          !celebrationPanel.hidden,
          'Closing the town-distance sorter should leave the celebration finder open',
        );

        const rows = document.querySelectorAll('.egeltools-celebration__town');
        window.__initialCelebrationRowHeights = [...rows].map((row) => row.getBoundingClientRect().height);
        document.body.dataset.initialCelebrationRowHeights = JSON.stringify(window.__initialCelebrationRowHeights);
        const rowLayouts = [...rows].map((row) => ({
          linkTop: row.querySelector('.egeltools-celebration__town-link').getBoundingClientRect().top,
          actionsTop: row.querySelector('.egeltools-celebration__actions').getBoundingClientRect().top,
        }));
        document.body.dataset.celebrationRowLayouts = JSON.stringify(rowLayouts);
        const text = document.getElementById('egeltools-celebration-finder-body').textContent;
        console.assert(floatingButton.textContent === 'Hide CFs', 'The docked celebrations button should reflect the open state');
        console.assert(rows.length === 2, `Expected 2 celebration rows, found ${rows.length}`);
        console.assert(
          rowLayouts.every((layout) => Math.abs(layout.linkTop - layout.actionsTop) <= 2),
          'Town names and celebration buttons should stay on one line',
        );
        console.assert(text.includes('Athens') && text.includes('Theater'), 'Athens should offer a theater performance');
        console.assert(text.includes('Thèbes') && text.includes('City party'), 'Thèbes should offer a city party');
        console.assert(!text.includes('Sparta'), 'Sparta should not be eligible below 18,000 effective capacity');
        console.assert(!text.includes('Olympics'), 'Olympic Games should be disabled by default');

        const athens = window.__towns[101];
        const athensBuildings = athens.buildings().attributes;
        const originalAthensGetStorage = athens.getStorage;
        athens.getStorage = () => 12000;
        document.getElementById('egeltools-celebration-finder-refresh').click();
        console.assert(
          document.querySelector('[data-town-id="101"][data-celebration-type="theater"]'),
          'A theater town with Academy 30 and exactly 12,000 effective capacity should be eligible',
        );
        athens.getStorage = () => 11999;
        document.getElementById('egeltools-celebration-finder-refresh').click();
        console.assert(
          !document.querySelector('[data-town-id="101"][data-celebration-type="theater"]'),
          'A theater town below 12,000 effective capacity should not be eligible',
        );
        athens.getStorage = originalAthensGetStorage;
        athensBuildings.academy = 29;
        document.getElementById('egeltools-celebration-finder-refresh').click();
        console.assert(
          !document.querySelector('[data-town-id="101"][data-celebration-type="theater"]'),
          'A theater town below Academy 30 should not be eligible',
        );
        athensBuildings.academy = 30;
        document.getElementById('egeltools-celebration-finder-refresh').click();

        const activeCelebrations = window.__celebrations;
        window.__celebrations = undefined;
        document.getElementById('egeltools-celebration-finder-refresh').click();
        const emptyCelebrationText = document.getElementById('egeltools-celebration-finder-body').textContent;
        console.assert(
          !emptyCelebrationText.includes('data is not available'),
          'A missing Celebration model bucket should be treated as zero active celebrations',
        );
        console.assert(
          document.querySelector('[data-town-id="101"][data-celebration-type="party"]'),
          'A town should offer its city party when no Celebration model bucket exists',
        );
        window.__celebrations = activeCelebrations;
        document.getElementById('egeltools-celebration-finder-refresh').click();

        const olympicsSetting = document.getElementById('egeltools-celebration-olympics-enabled');
        console.assert(olympicsSetting && !olympicsSetting.checked, 'The Olympics setting should default to off');
        olympicsSetting.click();
        const olympicsRows = document.querySelectorAll('.egeltools-celebration__town');
        const olympicsText = document.getElementById('egeltools-celebration-finder-body').textContent;
        console.assert(
          localStorage.getItem('egeltools_celebration_olympics_enabled') === 'on',
          'The Olympics setting should persist',
        );
        console.assert(olympicsRows.length === 3, `Expected 3 rows with Olympics enabled, found ${olympicsRows.length}`);
        console.assert(
          olympicsText.includes('Sparta') && olympicsText.includes('Olympics'),
          'An Academy 30 town should offer Olympic Games even when it cannot host a city party',
        );
        document.querySelector('.gold_amount').textContent = '49';
        document.getElementById('egeltools-celebration-finder-refresh').click();
        console.assert(
          [...document.querySelectorAll('[data-celebration-type="games"]')]
            .every((button) => button.disabled),
          'Olympic Games should be disabled when fewer than 50 gold is available',
        );
        document.querySelector('.gold_amount').textContent = '200';
        document.getElementById('egeltools-celebration-finder-refresh').click();

        delete window.__celebrations.activeParty;
        Object.assign(window.__towns[101].resources(), { wood: 15000, stone: 18000, iron: 15000 });
        document.getElementById('egeltools-celebration-finder-refresh').click();

        document.querySelector('.egeltools-celebration__town-link[data-town-id="102"]').click();
        document.body.dataset.switchedTownIds = JSON.stringify(window.__switchedTownIds);
        console.assert(window.__switchedTownIds[0] === 102, 'Clicking a town name should switch to that town');

        const bulkButtons = Object.fromEntries(
          [...document.querySelectorAll('[data-bulk-celebration-type]')]
            .map((button) => [button.dataset.bulkCelebrationType, button]),
        );
        console.assert(
          Object.keys(bulkButtons).length === 3
            && Object.values(bulkButtons).every((button) => !button.disabled),
          'Separate affordable bulk controls should be available for festivals, theater, and Olympics',
        );
        const panelHeightBeforeBulkStart = document.getElementById('egeltools-celebration-finder')
          .getBoundingClientRect().height;
        window.__activeTownGroupId = 7;
        bulkButtons.party.click();
        console.assert(
          window.__celebrationRequests.length === 0
            && getNotificationMessages().some(({ type, message }) => (
              type === 'error' && message.includes('Select “All towns”')
            )),
          'A selected town group should show a red warning and block the bulk celebration request',
        );
        window.__activeTownGroupId = -1;
        window.__suppressNextBulkCallback = true;
        bulkButtons.party.click();
        await waitFor(() => (
          window.__celebrationRequests.length === 1
            && window.__activeTownGroupId === -1
        ));
        console.assert(
          window.__activeTownGroupId === -1 && window.__townGroupChanges.length === 0,
          'Starting all city parties should not change the active group',
        );
        bulkButtons.theater.click();
        await waitFor(() => (
          window.__celebrationRequests.length === 2
            && window.__activeTownGroupId === -1
        ));
        console.assert(
          window.__activeTownGroupId === -1 && window.__townGroupChanges.length === 0,
          'Starting all theater performances should not change the active group',
        );
        bulkButtons.games.click();
        await waitFor(() => (
          window.__celebrationRequests.length === 3
            && window.__activeTownGroupId === -1
        ));
        const panelHeightAfterBulkStart = document.getElementById('egeltools-celebration-finder')
          .getBoundingClientRect().height;
        document.body.dataset.celebrationRequests = JSON.stringify(window.__celebrationRequests);
        console.assert(
          window.__celebrationRequests.length === 3,
          'Each bulk control should send exactly one Administrator request',
        );
        console.assert(
          window.__celebrationRequests.every((request) => (
            request.controller === 'town_overviews'
          )),
          'Every bulk request should use the town-overviews controller',
        );
        console.assert(
          window.__celebrationRequests
            .filter((request) => ['party', 'theater', 'games'].includes(request.data.celebration_type))
            .every((request) => (
              request.action === 'start_all_celebrations'
                && !Object.hasOwn(request.data, 'town_id')
                && !Object.hasOwn(request.data, 'group_id')
                && !Object.hasOwn(request.data, 'town_group_id')
            )),
          'Every bulk control should match the native Administrator request payload',
        );
        console.assert(
          window.__celebrationRequests
            .filter((request) => request.data.celebration_type === 'party')
            .length === 1,
          'Starting all city parties should use one Administrator request',
        );
        console.assert(
          window.__celebrationRequests.filter((request) => (
            request.data.celebration_type === 'games'
              && request.action === 'start_all_celebrations'
              && !Object.hasOwn(request.data, 'town_id')
          )).length === 1,
          'The Olympics bulk button should send one Administrator request',
        );
        console.assert(
          window.__celebrationRequests.some((request) => request.data.celebration_type === 'party')
            && window.__celebrationRequests.some((request) => request.data.celebration_type === 'theater'),
          'The festival and theater bulk buttons should send their own requests',
        );
        console.assert(
          window.__townGroupChanges.length === 0 && window.__activeTownGroupId === -1,
          'No Administrator bulk action should change the active group',
        );
        console.assert(
          window.__bulkActionSequence.join(',')
            === 'request:party,request:theater,request:games',
          'Every celebration bulk action should submit once without selecting another group',
        );
        console.assert(
          await waitFor(() => bulkButtons.party.textContent !== 'Starting…', 4000),
          'An interrupted Grepolis callback should not leave the bulk celebration button stuck',
        );
        console.assert(
          panelHeightAfterBulkStart <= panelHeightBeforeBulkStart,
          'Putting the split bulk controls in the existing header should not increase the panel footprint',
        );
        await new Promise((resolve) => setTimeout(resolve, 300));
        console.assert(
          !document.querySelector('[data-town-id="102"][data-celebration-type="party"]'),
          'A successfully started celebration action should disappear from the available list',
        );
        console.assert(
          !document.getElementById('egeltools-celebration-finder-body').textContent.includes('Sparta'),
          'A town with no remaining celebration actions should disappear from the list',
        );
        const captainRequestCount = window.__islandUtilityRequests.length;
        const staleCaptainTradeButton = fv301.querySelector('[data-island-utility-action="trade"]');
        advisor.classList.remove('captain_active');
        console.assert(
          await waitFor(() => !document.getElementById('egeltools-bd-level-check'))
            && islandOverview.querySelectorAll('[data-egeltools-island-utility]').length === 0,
          'The FV overview and quick actions should be removed when Captain becomes inactive',
        );
        staleCaptainTradeButton.click();
        console.assert(
          window.__islandUtilityRequests.length === captainRequestCount,
          'A detached FV quick action must not submit after Captain becomes inactive',
        );
        window.Game.premium_features.captain = Math.floor(Date.now() / 1000) + 3600;
        advisor.classList.add('captain-state-changed');
        console.assert(
          await waitFor(() => document.getElementById('egeltools-bd-level-check'))
            && await waitFor(() => islandOverview.querySelector('[data-egeltools-island-utility]')),
          'An active Captain premium entry should restore the FV overview and quick actions',
        );
        document.body.dataset.smokeFailed = window.__assertFailures.join('\n');
        document.body.dataset.smokeComplete = 'true';
      });
    </script>
  </body>
</html>
