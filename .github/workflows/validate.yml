name: Validate publisher
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 -m venv /tmp/publisher-tests
          /tmp/publisher-tests/bin/pip install 'PyJWT[crypto]==2.10.1'
          /tmp/publisher-tests/bin/python -m unittest discover -s tests -p test_publisher.py
          bash -n scripts/deploy.sh scripts/setup-publisher.sh
          if [ -f EgelTools.user.js ]; then node --check EgelTools.user.js; else node --check egeltools.user.js; fi
